<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; }
        .timeline-item { position: relative; padding-left: 2.5rem; margin-bottom: 1.5rem; }
        .timeline-item::before { content: ''; position: absolute; left: 0.5rem; top: 0; bottom: -1.5rem; width: 2px; background-color: #e9ecef; }
        .timeline-item:last-child::before { display: none; }
        .timeline-icon { position: absolute; left: 0; top: 0; width: 1.25rem; height: 1.25rem; border-radius: 50%; background-color: #0d6efd; border: 3px solid white; box-shadow: 0 0 0 2px #0d6efd; }
        .timeline-icon.latest { background-color: #198754; box-shadow: 0 0 0 2px #198754; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-clock-history me-2 text-primary"></i>Histórico de Atendimento</h2>
    </div>

    <div class="row g-4">
        <!-- Último Atendimento -->
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm bg-primary text-white mb-4">
                <div class="card-body p-4 text-center">
                    <h6 class="text-white-50 text-uppercase fw-bold mb-3"><i class="bi bi-star-fill me-2 text-warning"></i>Último Atendimento</h6>
                    <div th:if="${ultimoAtendimento != null}">
                        <div class="bg-white text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-fill fs-1"></i>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${ultimoAtendimento.paciente.nome}">Nome</h4>
                        <div class="badge bg-white text-primary rounded-pill px-3 py-2 mb-3 mt-2">
                            ID do Atendimento: #<span th:text="${ultimoAtendimento.id}"></span>
                        </div>
                        <p class="mb-0 text-white-50"><i class="bi bi-calendar-check me-2"></i><span th:text="${#temporals.format(ultimoAtendimento.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></span></p>
                        
                        <form th:action="@{/web/historico/removerUltimo}" method="post" class="mt-3">
                            <button type="submit" class="btn btn-sm btn-light text-danger fw-bold rounded-pill px-4 shadow-sm">
                                <i class="bi bi-trash-fill me-2"></i>Remover
                            </button>
                        </form>
                    </div>
                    <div th:if="${ultimoAtendimento == null}" class="py-4">
                        <i class="bi bi-journal-x fs-1 text-white-50 mb-3 d-block"></i>
                        <p class="mb-0">Nenhum atendimento realizado hoje.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista Completa Timeline -->
        <div class="col-md-7 col-lg-8">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-list-task me-2 text-secondary"></i>Registro Completo</h5>
                    
                    <div class="mt-4 ms-2">
                        <div th:each="atendimento, stat : ${historicoCompleto}" class="timeline-item">
                            <div class="timeline-icon" th:classappend="${stat.index == 0 ? 'latest' : ''}"></div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="fw-bold mb-1 text-dark" th:text="${atendimento.paciente.nome}">Nome do Paciente</h6>
                                    <p class="text-muted small mb-0"><i class="bi bi-fingerprint me-1"></i>Atendimento #<span th:text="${atendimento.id}"></span></p>
                                </div>
                                <span class="badge bg-light text-dark border px-3 py-2 rounded-pill shadow-sm">
                                    <i class="bi bi-clock me-1 text-muted"></i><span th:text="${#temporals.format(atendimento.dataHora, 'dd/MM - HH:mm')}">14:00</span>
                                </span>
                            </div>
                        </div>
                        
                        <div th:if="${#lists.isEmpty(historicoCompleto)}" class="text-center py-5">
                            <i class="bi bi-clipboard-x fs-1 text-black-50 mb-3 d-block"></i>
                            <h6 class="text-muted">O histórico está vazio.</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
