<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página Inicial - Clínica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .dashboard-card { transition: transform 0.2s; border: none; border-radius: 12px; }
        .dashboard-card:hover { transform: translateY(-5px); }
        .icon-box { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark"><i class="bi bi-house-door-fill me-2 text-primary"></i>Dashboard Inicial</h2>
            <p class="text-muted">Visão geral do sistema de atendimento da clínica.</p>
        </div>
    </div>
    
    <div class="row g-4 mb-4">
        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card shadow-sm h-100 bg-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="card-subtitle text-muted fw-bold">Pacientes Cadastrados</h6>
                        <div class="icon-box bg-primary bg-opacity-10 text-primary">
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="${qtdPacientes}">0</h2>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card shadow-sm h-100 bg-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="card-subtitle text-muted fw-bold">Na Fila de Espera</h6>
                        <div class="icon-box bg-warning bg-opacity-10 text-warning">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="${qtdFila}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card shadow-sm h-100 bg-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="card-subtitle text-muted fw-bold">Salas Ocupadas</h6>
                        <div class="icon-box bg-danger bg-opacity-10 text-danger">
                            <i class="bi bi-door-closed"></i>
                        </div>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="${salasOcupadas}">0</h2>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card shadow-sm h-100 bg-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="card-subtitle text-muted fw-bold">Salas Disponíveis</h6>
                        <div class="icon-box bg-success bg-opacity-10 text-success">
                            <i class="bi bi-door-open"></i>
                        </div>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="${salasDisponiveis}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card dashboard-card shadow-sm bg-white">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-3"><i class="bi bi-clock-history me-2 text-info"></i>Último Atendimento</h5>
                    <div th:if="${ultimoAtendimento != null}" class="d-flex align-items-center">
                        <div class="icon-box bg-info bg-opacity-10 text-info me-3">
                            <i class="bi bi-person-check-fill"></i>
                        </div>
                        <div>
                            <h4 class="mb-1 fw-bold" th:text="${ultimoAtendimento.paciente.nome}">Nome</h4>
                            <p class="text-muted mb-0">Atendimento #<span th:text="${ultimoAtendimento.id}"></span> - Realizado em <span th:text="${#temporals.format(ultimoAtendimento.dataHora, 'dd/MM/yyyy HH:mm')}"></span></p>
                        </div>
                    </div>
                    <div th:if="${ultimoAtendimento == null}">
                        <p class="text-muted mb-0"><i class="bi bi-info-circle me-1"></i>Nenhum atendimento registrado hoje.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
